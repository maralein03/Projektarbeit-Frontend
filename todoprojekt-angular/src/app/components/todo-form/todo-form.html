<div class="form-container">
  <h1>Neue Aufgabe erstellen</h1>

  <div *ngIf="success" class="success-message">
    ✓ Aufgabe erfolgreich erstellt! Sie werden weitergeleitet...
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <form [formGroup]="todoForm" (ngSubmit)="onSubmit()" class="todo-form">
    <div class="form-group">
      <label for="title">Titel *</label>
      <input
        type="text"
        id="title"
        formControlName="title"
        class="form-control"
        [class.is-invalid]="todoForm.get('title')?.invalid && todoForm.get('title')?.touched"
        placeholder="Geben Sie einen Titel ein (3-100 Zeichen)"
      />
      <div *ngIf="todoForm.get('title')?.invalid && todoForm.get('title')?.touched" class="error-text">
        <span *ngIf="todoForm.get('title')?.errors?.['required']">Titel ist erforderlich</span>
        <span *ngIf="todoForm.get('title')?.errors?.['minlength']">Mindestens 3 Zeichen</span>
        <span *ngIf="todoForm.get('title')?.errors?.['maxlength']">Maximal 100 Zeichen</span>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Beschreibung *</label>
      <textarea
        id="description"
        formControlName="description"
        class="form-control"
        [class.is-invalid]="todoForm.get('description')?.invalid && todoForm.get('description')?.touched"
        rows="4"
        placeholder="Geben Sie eine Beschreibung ein (5-200 Zeichen)"
      ></textarea>
      <div *ngIf="todoForm.get('description')?.invalid && todoForm.get('description')?.touched" class="error-text">
        <span *ngIf="todoForm.get('description')?.errors?.['required']">Beschreibung ist erforderlich</span>
        <span *ngIf="todoForm.get('description')?.errors?.['minlength']">Mindestens 5 Zeichen</span>
        <span *ngIf="todoForm.get('description')?.errors?.['maxlength']">Maximal 200 Zeichen</span>
      </div>
    </div>

    <div class="form-group">
      <label for="status">Status *</label>
      <select
        id="status"
        formControlName="status"
        class="form-control"
        [class.is-invalid]="todoForm.get('status')?.invalid && todoForm.get('status')?.touched"
      >
        <option value="">-- Status wählen --</option>
        <option value="OPEN">Offen</option>
        <option value="IN_PROGRESS">In Bearbeitung</option>
        <option value="DONE">Erledigt</option>
      </select>
      <div *ngIf="todoForm.get('status')?.invalid && todoForm.get('status')?.touched" class="error-text">
        <span *ngIf="todoForm.get('status')?.errors?.['required']">Status ist erforderlich</span>
      </div>
    </div>

    <div class="form-group">
      <label for="assignedTo">Zugewiesen an *</label>
      <input
        type="text"
        id="assignedTo"
        formControlName="assignedTo"
        class="form-control"
        [class.is-invalid]="todoForm.get('assignedTo')?.invalid && todoForm.get('assignedTo')?.touched"
        placeholder="Geben Sie einen Namen ein"
      />
      <div *ngIf="todoForm.get('assignedTo')?.invalid && todoForm.get('assignedTo')?.touched" class="error-text">
        <span *ngIf="todoForm.get('assignedTo')?.errors?.['required']">Zuordnung ist erforderlich</span>
      </div>
    </div>

    <div class="button-group">
      <button type="submit" [disabled]="submitting" class="btn btn-primary">
        {{ submitting ? 'Erstellen...' : 'Aufgabe erstellen' }}
      </button>
      <a routerLink="/dashboard" class="btn btn-secondary">Abbrechen</a>
    </div>
  </form>
</div>
