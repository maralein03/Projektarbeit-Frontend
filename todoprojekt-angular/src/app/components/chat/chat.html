<div class="chat-container">
  <div class="chat-header">
    <h2>Chat: {{ todoTitle }}</h2>
  </div>

  <div class="messages-container" *ngIf="!loading">
    <div *ngIf="messages.length === 0" class="no-messages">
      Keine Nachrichten noch. Starten Sie das Gespräch!
    </div>

    <div *ngFor="let msg of messages" class="message" [class.own-message]="isOwnMessage(msg)">
      <div class="message-header">
        <strong class="sender">{{ senderLabel(msg) }}</strong>
        <span class="timestamp">{{ msg.createdAt | date:'short' }}</span>
      </div>
      <div class="message-content">{{ msg.message }}</div>
    </div>
  </div>

  <div *ngIf="loading" class="loading">Nachrichten werden geladen...</div>

  <div class="chat-input-section">
    <textarea
      [(ngModel)]="newMessage"
      placeholder="Ihre Nachricht..."
      rows="3"
      (keyup.enter)="sendMessage()"
      class="message-input">
    </textarea>
    <button (click)="sendMessage()" class="btn btn-primary">Senden</button>
  </div>
</div>
