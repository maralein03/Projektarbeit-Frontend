<div class="dashboard-container">

  <!-- Ausbilder: Neue Aufgabe erstellen -->
  <div *ngIf="hasRole('ROLE_UPDATE')" class="welcome-section">
    <div class="welcome-card">
      <div class="welcome-icon">📋</div>
      <h1>Willkommen, {{ currentUsername }}!</h1>
      <p>Erstelle neue Aufgaben für deine Lernenden oder verwalte alle Aufgaben unter <strong>Alle Aufgaben</strong>.</p>
      <button mat-raised-button routerLink="/todos/create" class="create-button">
       
        Neue Aufgabe erstellen
      </button>
    </div>
  </div>

  <!-- Lernender: Hinweis -->
  <div *ngIf="!hasRole('ROLE_UPDATE')" class="welcome-section">
    <div class="welcome-card">
      <div class="welcome-icon">👋</div>
      <h1>Willkommen, {{ currentUsername }}!</h1>
      <p>Deine zugewiesenen Aufgaben findest du unter <strong>Alle Aufgaben</strong>.</p>
      <button mat-raised-button routerLink="/todos" class="create-button">
        
        Meine Aufgaben ansehen
      </button>
    </div>
  </div>

  <!-- Chat Modal -->
  <app-chat-modal 
    [isOpen]="chatModalOpen" 
    [todoId]="activeChatTodo?.id ?? null" 
    [todoTitle]="activeChatTodo?.title ?? ''" 
    (closed)="closeChat()">
  </app-chat-modal>
</div>
