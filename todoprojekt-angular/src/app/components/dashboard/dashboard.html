<div class="dashboard-container">
  <h1>Meine Aufgaben</h1>

  <div class="actions" *ngIf="hasRole('ROLE_UPDATE')">
    <button routerLink="/todos/create" class="btn btn-primary">
      Neue Aufgabe erstellen
    </button>
  </div>

  <div *ngIf="loading" class="loading">Laden...</div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="todos-grid" *ngIf="!loading && todos.length > 0">
    <div *ngFor="let todo of todos" 
         class="todo-card" 
         [appHighlightStatus]="todo.status">
      <h3>{{ todo.title }}</h3>
      <p>{{ todo.description }}</p>
      <span class="status" [class]="'status-' + todo.status.toLowerCase()">
        {{ todo.status }}
      </span>
      <div class="card-actions">
        <a [routerLink]="['/todos', todo.id]" class="btn btn-secondary">Anzeigen</a>
        <a [routerLink]="['/questions', todo.id]" class="btn btn-secondary">Fragen</a>
        <button *ngIf="hasRole('ROLE_UPDATE')" 
                (click)="deleteTodo(todo.id)" 
                class="btn btn-danger">
          Löschen
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && todos.length === 0" class="no-todos">
    Keine Aufgaben gefunden
  </div>
</div>
